name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT: ${{ github.workspace }}/.godot-bin/godot
    steps:
      - uses: actions/checkout@v4

      # LFS files (GodotSteam's native libraries, the models) come from a cache when they
      # have not changed: every download counts against the account's monthly LFS bandwidth.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS files
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS files
        run: git lfs pull

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT"

      # A fresh import that discovers a GDExtension mid-scan aborts on exit (Godot 4.7.2 +
      # GodotSteam 4.22.1). Registering it up front makes Godot load it at start-up instead.
      - name: Register GDExtensions
        run: |
          mkdir -p game/.godot
          echo "res://addons/godotsteam/godotsteam.gdextension" > game/.godot/extension_list.cfg

      - name: Import project
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: GDScript warnings (the editor shows them, headless runs do not)
        run: timeout 120 "$GODOT" --headless --path game --script res://tests/lint_warnings.gd

      - name: Unit tests
        run: timeout 120 "$GODOT" --headless --path game --script res://tests/run_unit_tests.gd

      # A few matches per experiment: catches engine errors and crashes in the bots, not balance.
      - name: Simulator smoke run
        run: timeout 120 "$GODOT" --headless --path game --script res://sim/simulate.gd -- --matches=20 --out="$RUNNER_TEMP/sim.md"

      - name: End-to-end night (online equals the simulator, hidden information, voice)
        run: game/tests/e2e/run_e2e.sh

      - name: End-to-end night where a player leaves (a bot takes over)
        run: LEAVER=1 game/tests/e2e/run_e2e.sh
